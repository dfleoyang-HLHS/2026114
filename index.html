<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>教室座位表</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#f6f8fc;--card:#fff;--ink:#172033;--muted:#64748b;--accent:#2563eb;--line:#dbe3ef;--success:#059669;--warning:#ea580c;--danger:#dc2626}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
    header{padding:28px 20px 18px;text-align:center;background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff}
    h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}header p{margin:0;color:rgba(255,255,255,.9)}
    main{width:min(1180px,94vw);margin:auto;padding-bottom:20px}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0 18px}
    button{border:0;border-radius:10px;padding:10px 15px;font-size:15px;cursor:pointer;background:#e8eef8;color:var(--ink);transition:all .2s;box-shadow:0 2px 4px #00000010}
    button:hover{transform:translateY(-2px);box-shadow:0 4px 8px #00000020}
    button:active{transform:translateY(0);box-shadow:0 1px 2px #00000010}
    button.primary{background:var(--accent);color:#fff}
    button.primary:hover{background:#1d4ed8}
    button.success{background:var(--success);color:#fff}
    button.success:hover{background:#047857}
    button.warning{background:var(--warning);color:#fff}
    button.warning:hover{background:#c2410c}
    button.danger{background:var(--danger);color:#fff}
    button.danger:hover{background:#b91c1c}
    .status{padding:12px;border-radius:10px;text-align:center;margin:10px 0;font-weight:700;transition:all .3s}
    .status.default{background:var(--card);color:var(--muted);border:1px solid var(--line)}
    .status.success{background:#dcfce7;color:var(--success);border:2px solid var(--success)}
    .status.error{background:#fee2e2;color:var(--danger);border:2px solid var(--danger)}
    .status.info{background:#dbeafe;color:var(--accent);border:2px solid var(--accent)}
    .room{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(12px,3vw,26px);box-shadow:0 8px 30px #1e3a8a0d;overflow-x:auto}
    .front{margin:0 auto 18px;text-align:center;background:#172033;color:white;border-radius:9px;padding:10px;font-weight:700;letter-spacing:.15em}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:10px}
    .seat{min-height:102px;border:2px dashed #cbd5e1;border-radius:13px;padding:9px;background:#fbfdff;transition:all .2s;cursor:grab;user-select:none;touch-action:none}
    .seat.empty{display:grid;place-items:center;color:#94a3b8;cursor:default}
    .seat.dragging{opacity:.35;background:#e2e8f0;transform:scale(.95)}
    .seat.over{border-color:#dc2626;border-style:solid;background:#fee2e2;transform:scale(1.05);box-shadow:0 0 0 3px #fecaca}
    .num{font-size:12px;color:var(--muted)}
    .name{font-size:18px;font-weight:800;margin:7px 0 5px}
    .meta{font-size:12px;color:var(--muted)}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
    label{display:block;font-weight:700;font-size:.85rem;margin-bottom:4px}
    input,select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;transition:border .2s}
    input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #dbeafe}
    .github{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
    .github-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
    .file-list{margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid var(--line)}
    .file-list h4{margin:0 0 10px;font-size:15px;color:var(--ink)}
    .file-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:300px;overflow-y:auto}
    .file-item{padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:all .2s;text-align:center;font-size:14px}
    .file-item:hover{border-color:var(--accent);background:#eff6ff;transform:translateY(-2px);box-shadow:0 4px 8px #00000010}
    .file-item:active{transform:translateY(0)}
    @media(max-width:650px){.grid{gap:6px}.seat{min-height:82px;padding:6px}.name{font-size:15px}.meta{font-size:11px}.toolbar{gap:6px}button{padding:8px 12px;font-size:14px}.file-items{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
    @media print{header,.toolbar,.controls,.github,.status,.file-list{display:none!important}.room{border:1px solid #000;box-shadow:none}}
  </style>
</head>
<body>
<header><h1>教室座位表產生器</h1><p>Classroom Seating Chart Generator</p></header>
<main>
  <div class="controls">
    <div><label>上傳點名表</label><input id="fileInput" type="file" accept=".xlsx,.xls,.csv"></div>
    <div><label>每排座位數</label><select id="cols"><option>5</option><option selected>6</option><option>7</option><option>8</option></select></div>
    <div><label>排列方式</label><select id="order"><option value="row">由前到後</option><option value="column">由左到右</option><option value="number">依座號</option></select></div>
    <div><label>標題</label><input id="title" value="教室座位表"></div>
  </div>

  <div class="toolbar">
    <button class="primary" onclick="autoFill()">✨ 自動填滿</button>
    <button class="danger" onclick="clearSeats()">🗑️ 清除</button>
    <button class="success" onclick="downloadExcel()">📊 Excel</button>
    <button class="warning" onclick="window.print()">🖨️ 列印 / PDF</button>
    <button class="success" onclick="saveLocal()">💾 儲存本機</button>
    <button class="primary" onclick="loadLocal()">📂 從本機載入</button>
    <button class="primary" onclick="uploadToGithub()">📤 上傳 GitHub</button>
    <button class="success" onclick="listGithubFiles()">📋 重新整理檔案</button>
    <button class="primary" onclick="loadFromGithub()">📥 載入選擇的檔案</button>
  </div>

  <div class="status default" id="status">操作：拖放座位即可交換（手機：長按後拖曳）｜列印時選擇「另存為 PDF」</div>

  <div class="room">
    <div class="front" id="frontTitle">講台</div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="github">
    <h3 style="margin:0 0 10px">GitHub 設定</h3>
    <div class="github-grid">
      <div><label>使用者名稱</label><input id="ghUser" value="dfleoyang-HLHS"></div>
      <div><label>儲存庫</label><input id="ghRepo" value="2026114"></div>
      <div><label>Token</label><input id="ghToken" type="password" placeholder="ghp_..."></div>
      <div><label>分支</label><input id="ghBranch" value="main"></div>
    </div>
    <p style="font-size:13px;color:var(--muted);margin:10px 0 0">上傳/載入的檔案名稱為「標題名.json」（例如：教室座位表.json）</p>
    
    <div class="file-list" id="fileList" style="display:none">
      <h4>📁 選擇要載入的座位表（共 <span id="fileCount">0</span> 個）</h4>
      <div class="file-items" id="fileItems"></div>
    </div>
  </div>
</main>
<script>
const students=[];
let order=[],cols=6,dragged=null,touchDragged=null;
const $=id=>document.getElementById(id);
const statusEl=$('status');

function showStatus(msg,type){
  statusEl.textContent=msg;
  statusEl.className='status '+(type||'default')
}

function load(){try{let x=JSON.parse(localStorage.getItem('seating-v1'));return Array.isArray(x)?x:null}catch(e){return null}}

function render(){
  const grid=$('grid');
  grid.innerHTML='';
  grid.style.gridTemplateColumns='repeat('+cols+',minmax(90px,1fr))';
  
  order.forEach((no,i)=>{
    const s=no!==null?students.find(x=>x.no===no):null;
    const el=document.createElement('div');
    el.className='seat'+(s?'':' empty');
    el.dataset.index=i;
    el.innerHTML=s?`<span class="num">座號 ${s.no}</span><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.className)}｜${esc(s.id)}</div>`:`<span class="num">空位</span>`;
    
    if(s){
      // 桌面版拖放
      el.draggable=true;
      el.addEventListener('dragstart',()=>{dragged=i;el.classList.add('dragging')});
      el.addEventListener('dragend',()=>{dragged=null;el.classList.remove('dragging');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
      
      // 手機版觸控
      el.addEventListener('touchstart',function(e){
        touchDragged=i;
        el.classList.add('dragging');
        e.preventDefault()
      },{passive:false});
      el.addEventListener('touchmove',function(e){
        e.preventDefault()
      },{passive:false});
      el.addEventListener('touchend',function(e){
        el.classList.remove('dragging');
        const touch=e.changedTouches[0];
        const target=document.elementFromPoint(touch.clientX,touch.clientY);
        if(target&&target.classList.contains('seat')){
          const targetIndex=Number(target.dataset.index);
          if(touchDragged!==null&&touchDragged!==targetIndex){
            [order[touchDragged],order[targetIndex]]=[order[targetIndex],order[touchDragged]];
            render();
            showStatus('✅ 已調整座位','success')
          }
        }
        touchDragged=null;
        e.preventDefault()
      },{passive:false})
    }
    
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');if(dragged!==null&&dragged!==i){[order[dragged],order[i]]=[order[i],order[dragged]];render();showStatus('✅ 已調整座位','success')}});
    
    grid.appendChild(el)
  })
}

function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function autoFill(){
  order=[];
  const list=[...students];
  if($('order').value==='number')list.sort((a,b)=>(a.className+'-'+a.number).localeCompare(b.className+'-'+b.number));
  const total=cols*Math.ceil(list.length/cols);
  for(let i=0;i<total;i++){order.push(i<list.length?list[i].no:null)}
  render();
  showStatus('✅ 已自動排列','success')
}

function clearSeats(){
  order=[];
  const total=cols*Math.ceil(students.length/cols);
  for(let i=0;i<total;i++){order.push(null)}
  render();
  showStatus('🗑️ 已清除所有座位','info')
}

$('fileInput').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,5);i++){if(rows[i].some(v=>String(v).includes('學號'))){hi=i;break}}
      if(hi<0)throw new Error('找不到學號欄位');
      const h=rows[hi].map(v=>String(v).trim().toLowerCase());
      const ix={id:h.findIndex(v=>v.includes('學號')),cls:h.findIndex(v=>v.includes('班級')),no:h.findIndex(v=>v.includes('座號')),name:h.findIndex(v=>v.includes('姓名'))};
      if(ix.id<0||ix.cls<0||ix.no<0||ix.name<0)throw new Error('缺少必要欄位');
      students.length=0;
      let no=1;
      rows.slice(hi+1).forEach(function(r){
        const id=String(r[ix.id]||'').trim(),cls=String(r[ix.cls]||'').trim(),num=String(r[ix.no]||'').trim(),name=String(r[ix.name]||'').trim();
        if(id&&name)students.push({no:no++,id,className:cls,number:num,name})
      });
      cols=Number($('cols').value);
      autoFill();
      showStatus('✅ 已載入 '+students.length+' 位學生','success')
    }catch(err){showStatus('❌ 失敗：'+err.message,'error')}
  };
  r.readAsArrayBuffer(f)
});

$('cols').addEventListener('change',function(){cols=Number($('cols').value);autoFill()});
$('title').addEventListener('input',function(e){$('frontTitle').textContent=e.target.value||'講台'});

function saveLocal(){
  try{
    localStorage.setItem('seating-v1',JSON.stringify({students:students,order:order,cols:cols}));
    showStatus('💾 已儲存到本機瀏覽器','success')
  }catch(e){
    showStatus('❌ 儲存失敗：'+e.message,'error')
  }
}

function loadLocal(){
  try{
    const r=localStorage.getItem('seating-v1');
    if(!r){showStatus('📂 本機無資料','info');return}
    const d=JSON.parse(r);
    students.length=0;
    d.students.forEach(s=>students.push(s));
    order=d.order;
    cols=d.cols||6;
    $('cols').value=cols;
    render();
    showStatus('✅ 已從本機載入 '+students.length+' 人','success')
  }catch(e){
    showStatus('❌ 載入失敗：'+e.message,'error')
  }
}

function downloadExcel(){
  const d=order.map((no,i)=>{const s=no!==null?students.find(x=>x.no===no):null;return{'座位':i+1,'班級':s?s.className:'','座號':s?s.number:'','姓名':s?s.name:'','學號':s?s.id:''}});
  const ws=XLSX.utils.json_to_sheet(d),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'座位');
  XLSX.writeFile(wb,'seating.xlsx');
  showStatus('📊 Excel 已下載','success')
}

function uploadToGithub(){
  const user=$('ghUser').value.trim();
  const repo=$('ghRepo').value.trim();
  const token=$('ghToken').value.trim();
  const branch=$('ghBranch').value.trim()||'main';
  const title=$('title').value.trim()||'教室座位表';
  const filename=title+'.json';
  
  if(!user||!repo||!token){
    showStatus('❌ 請填寫 GitHub 使用者名稱、儲存庫和 Token','error');
    return
  }
  
  if(students.length===0){
    showStatus('❌ 無學生資料，請先上傳點名表','error');
    return
  }
  
  showStatus('📤 上傳中...','info');
  
  const data={students:students,order:order,cols:cols,title:title};
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  
  const api='https://api.github.com/repos/'+user+'/'+repo+'/contents/'+encodeURIComponent(filename);
  
  fetch(api+'?ref='+branch,{headers:{Authorization:'Bearer '+token}}).then(function(r){
    if(r.ok){
      return r.json().then(function(d){return d.sha})
    }else if(r.status===404){
      return null
    }else{
      return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status)})
    }
  }).then(function(sha){
    const body={
      message:'Update seating chart: '+title,
      content:content,
      branch:branch
    };
    if(sha)body.sha=sha;
    
    return fetch(api,{
      method:'PUT',
      headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    })
  }).then(function(r){
    if(!r.ok){
      return r.json().then(function(d){throw new Error(d.message||'HTTP '+r.status)})
    }
    return r.json()
  }).then(function(result){
    if(result.content&&result.content.html_url){
      showStatus('✅ 上傳成功！檔案：'+filename,'success');
      listGithubFiles();
      console.log('Uploaded to:',result.content.html_url)
    }else{
      showStatus('❌ 上傳失敗：未知錯誤','error')
    }
  }).catch(function(e){
    showStatus('❌ 上傳失敗：'+e.message,'error')
  })
}

function listGithubFiles(){
  const user=$('ghUser').value.trim();
  const repo=$('ghRepo').value.trim();
  const token=$('ghToken').value.trim();
  const branch=$('ghBranch').value.trim()||'main';
  
  if(!user||!repo){
    showStatus('❌ 請填寫 GitHub 使用者名稱和儲存庫','error');
    return
  }
  
  showStatus('📋 列出檔案中...','info');
  
  const api='https://api.github.com/repos/'+user+'/'+repo+'/contents?ref='+encodeURIComponent(branch);
  const headers=token?{Authorization:'Bearer '+token}:{};
  
  fetch(api,{headers:headers}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json()
  }).then(function(files){
    const fileList=$('fileList');
    const fileItems=$('fileItems');
    const fileCount=$('fileCount');
    
    fileItems.innerHTML='';
    let jsonCount=0;
    
    files.forEach(function(f){
      if(f.name.endsWith('.json')){
        jsonCount++;
        const item=document.createElement('div');
        item.className='file-item';
        item.textContent=f.name;
        item.onclick=function(){
          $('ghFile').value=f.name;
          loadFromGithubFile(f.name);
        };
        fileItems.appendChild(item)
      }
    });
    
    fileCount.textContent=jsonCount;
    
    if(jsonCount>0){
      fileList.style.display='block';
      showStatus('✅ 已找到 '+jsonCount+' 個 JSON 檔案，請點選下方檔案載入','success')
    }else{
      fileList.style.display='none';
      showStatus('⚠️ 未找到 JSON 檔案','info')
    }
  }).catch(function(e){
    showStatus('❌ 列出失敗：'+e.message,'error')
  })
}

function loadFromGithubFile(filename){
  const user=$('ghUser').value.trim();
  const repo=$('ghRepo').value.trim();
  const branch=$('ghBranch').value.trim()||'main';
  
  if(!user||!repo){
    showStatus('❌ 請填寫 GitHub 使用者名稱和儲存庫','error');
    return
  }
  
  showStatus('📥 載入中...','info');
  
  const url='https://raw.githubusercontent.com/'+user+'/'+repo+'/'+encodeURIComponent(branch)+'/'+encodeURIComponent(filename);
  
  fetch(url).then(function(r){
    if(!r.ok){
      if(r.status===404)throw new Error('找不到檔案：'+filename);
      throw new Error('HTTP '+r.status)
    }
    return r.json()
  }).then(function(data){
    students.length=0;
    if(data.students){
      data.students.forEach(function(s){students.push(s)})
    }
    order=data.order||[];
    cols=data.cols||6;
    if(data.title){
      $('title').value=data.title;
      $('frontTitle').textContent=data.title
    }
    $('cols').value=cols;
    render();
    showStatus('✅ 已載入 '+students.length+' 人（'+filename+'）','success')
  }).catch(function(e){
    showStatus('❌ 載入失敗：'+e.message,'error')
  })
}

function loadFromGithub(){
  const filename=$('ghFile').value.trim();
  if(filename){
    loadFromGithubFile(filename)
  }else{
    showStatus('❌ 請先選擇或輸入檔案名稱','error')
  }
}

window.onload=function(){
  const saved=load();
  if(saved){
    order=saved;
    const d=localStorage.getItem('seating-v1');
    if(d){
      const data=JSON.parse(d);
      students.length=0;
      data.students.forEach(s=>students.push(s));
      cols=data.cols||6;
      $('cols').value=cols;
      render();
      showStatus('✅ 從本機載入 '+students.length+' 人','success')
    }
  }
  // 自動列出 GitHub 檔案
  setTimeout(function(){
    const user=$('ghUser').value.trim();
    const repo=$('ghRepo').value.trim();
    const token=$('ghToken').value.trim();
    if(user&&repo&&token){
      listGithubFiles()
    }
  },500)
};
</script>
</body>
</html>
