<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>教室座位表</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#f6f8fc;--card:#fff;--ink:#172033;--muted:#64748b;--accent:#2563eb;--line:#dbe3ef;--success:#059669;--warning:#ea580c;--danger:#dc2626}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
    header{padding:28px 20px 18px;text-align:center;background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff}h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}header p{margin:0;color:rgba(255,255,255,.9)}main{width:min(1180px,94vw);margin:auto;padding-bottom:20px}
    .section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:0 4px 12px #00000008}.section-title{font-size:18px;font-weight:800;margin:0 0 12px;color:var(--ink);display:flex;align-items:center;gap:8px}.section-title::before{content:'';display:block;width:4px;height:20px;background:var(--accent);border-radius:2px}
    .github-grid,.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}label{display:block;font-weight:700;font-size:.85rem;margin-bottom:4px}input,select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;transition:border .2s}input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #dbeafe}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0 18px}button{border:0;border-radius:10px;padding:10px 15px;font-size:15px;cursor:pointer;background:#e8eef8;color:var(--ink);transition:all .2s;box-shadow:0 2px 4px #00000010}button:hover{transform:translateY(-2px);box-shadow:0 4px 8px #00000020}button:active{transform:translateY(0);box-shadow:0 1px 2px #00000010}button.primary{background:var(--accent);color:#fff}button.primary:hover{background:#1d4ed8}button.success{background:var(--success);color:#fff}button.success:hover{background:#047857}button.warning{background:var(--warning);color:#fff}button.warning:hover{background:#c2410c}button.danger{background:var(--danger);color:#fff}button.danger:hover{background:#b91c1c}
    .file-list{margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid var(--line)}.file-list h4{margin:0 0 10px;font-size:15px}.file-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:300px;overflow-y:auto}.file-item{padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:all .2s;text-align:center;font-size:14px}.file-item:hover{border-color:var(--accent);background:#eff6ff;transform:translateY(-2px)}.file-item.selected{border-color:var(--success);background:#dcfce7;color:var(--success);font-weight:700}.selected-file{margin-top:10px;padding:10px;background:#dcfce7;border:2px solid var(--success);border-radius:8px;text-align:center;font-weight:700;color:var(--success)}
    .status{padding:12px;border-radius:10px;text-align:center;margin:10px 0;font-weight:700;transition:all .3s}.status.default{background:var(--card);color:var(--muted);border:1px solid var(--line)}.status.success{background:#dcfce7;color:var(--success);border:2px solid var(--success)}.status.error{background:#fee2e2;color:var(--danger);border:2px solid var(--danger)}.status.info{background:#dbeafe;color:var(--accent);border:2px solid var(--accent)}
    .room{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(12px,3vw,26px);box-shadow:0 8px 30px #1e3a8a0d;overflow-x:auto}.front{margin:0 auto 18px;text-align:center;background:#172033;color:#fff;border-radius:9px;padding:10px;font-weight:700;letter-spacing:.15em}.grid{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:10px}.seat{min-height:102px;border:2px dashed #cbd5e1;border-radius:13px;padding:9px;background:#fbfdff;transition:all .2s;cursor:grab;user-select:none;touch-action:none}.seat.empty{display:grid;place-items:center;color:#94a3b8;cursor:default}.seat.dragging{opacity:.35;background:#e2e8f0;transform:scale(.95)}.seat.over{border-color:#dc2626!important;border-style:solid!important;background:#fee2e2!important;transform:scale(1.05)!important;box-shadow:0 0 0 3px #fecaca!important}.seat-num{font-size:24px;line-height:1.15;font-weight:900;color:#2563eb;margin-bottom:6px}.name{font-size:18px;font-weight:800;margin:6px 0 4px}.meta{font-size:12px;color:var(--muted)}.num{font-size:12px;color:var(--muted)}
    @media(max-width:650px){.grid{gap:6px}.seat{min-height:82px;padding:6px}.seat-num{font-size:21px}.name{font-size:16px}.meta{font-size:11px}.toolbar{gap:6px}button{padding:8px 12px;font-size:14px}.file-items{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}@media print{header,.toolbar,.controls,.status,.file-list,.section{display:none!important}.room{border:1px solid #000;box-shadow:none}}
  </style>
</head>
<body>
<header><h1>教室座位表產生器</h1><p>Classroom Seating Chart Generator</p></header>
<main>
  <div class="section">
    <h2 class="section-title">☁️ 從 GitHub 載入座位表</h2>
    <div class="github-grid"><div><label>使用者名稱</label><input id="ghUser" value="dfleoyang-HLHS"></div><div><label>儲存庫</label><input id="ghRepo" value="2026114"></div><div><label>Token</label><input id="ghToken" type="password" placeholder="ghp_..."></div><div><label>分支</label><input id="ghBranch" value="main"></div></div>
    <div class="toolbar" style="margin:14px 0 0"><button class="success" onclick="listGithubFiles()">📋 重新整理檔案</button><button class="primary" onclick="loadFromGithub()">📥 載入選擇的檔案</button></div>
    <div class="file-list" id="fileList" style="display:none"><h4>📁 選擇要載入的座位表（共 <span id="fileCount">0</span> 個）</h4><div class="file-items" id="fileItems"></div><div class="selected-file" id="selectedFile" style="display:none">✅ 已選擇：<span id="selectedFileName"></span></div></div>
  </div>
  <div class="section"><h2 class="section-title">📋 座位表設定</h2><div class="controls"><div><label>上傳點名表</label><input id="fileInput" type="file" accept=".xlsx,.xls,.csv"></div><div><label>每列座位數（橫向）</label><select id="cols"><option>5</option><option selected>6</option><option>7</option><option>8</option></select></div><div><label>排列方式</label><select id="order"><option value="row">由前到後</option><option value="column">由左到右</option><option value="number">依座號</option></select></div><div><label>標題</label><input id="title" value="教室座位表"></div></div></div>
  <div class="toolbar"><button class="primary" onclick="autoFill()">✨ 自動填滿</button><button class="success" onclick="saveLocal()">💾 儲存至本機</button><button class="primary" onclick="uploadToGithub()">☁️ 上傳到 GitHub</button><button class="warning" onclick="window.print()">🖨️ 列印 PDF</button><button class="success" onclick="downloadExcel()">📊 輸出 Excel</button><button class="danger" onclick="clearSeats()">🗑️ 清除</button></div>
  <div class="status default" id="status">操作：拖放座位即可交換（手機：長按後拖曳）｜卡片顯示您的原始座號</div>
  <div class="room"><div class="front" id="frontTitle">講台</div><div id="grid" class="grid"></div></div>
</main>
<script>
const students=[];let order=[],cols=6,dragged=null,touchDragged=null,selectedFilename=null;const $=id=>document.getElementById(id),statusEl=$('status');
function showStatus(msg,type){statusEl.textContent=msg;statusEl.className='status '+(type||'default')}
function render(){const grid=$('grid');grid.innerHTML='';grid.style.gridTemplateColumns='repeat('+cols+',minmax(90px,1fr))';order.forEach((no,i)=>{const s=no!==null?students.find(x=>x.no===no):null,el=document.createElement('div');el.className='seat'+(s?'':' empty');el.dataset.index=i;el.innerHTML=s?`<div class="seat-num">座號 ${esc(s.number||'-')}</div><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.className)}｜${esc(s.id)}</div>`:'<span class="num">空位</span>';if(s){el.draggable=true;el.addEventListener('dragstart',()=>{dragged=i;el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragged=null;el.classList.remove('dragging');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});el.addEventListener('touchstart',e=>{touchDragged=i;el.classList.add('dragging');e.preventDefault()},{passive:false});el.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});el.addEventListener('touchend',e=>{el.classList.remove('dragging');const t=e.changedTouches[0],target=document.elementFromPoint(t.clientX,t.clientY),seat=target&&target.closest('.seat');if(seat){const j=Number(seat.dataset.index);if(touchDragged!==null&&touchDragged!==j){[order[touchDragged],order[j]]=[order[j],order[touchDragged]];render();showStatus('✅ 已調整座位','success')}}touchDragged=null;e.preventDefault()},{passive:false})}el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');if(dragged!==null&&dragged!==i){[order[dragged],order[i]]=[order[i],order[dragged]];render();showStatus('✅ 已調整座位','success')}});grid.appendChild(el)})}
function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function autoFill(){order=[];const list=[...students];if($('order').value==='number')list.sort((a,b)=>(a.className+'-'+a.number).localeCompare(b.className+'-'+b.number));const total=cols*Math.ceil(list.length/cols);for(let i=0;i<total;i++)order.push(i<list.length?list[i].no:null);render();showStatus('✅ 已自動排列','success')}
function clearSeats(){order=Array(cols*Math.ceil(students.length/cols)).fill(null);render();showStatus('🗑️ 已清除所有座位','info')}
$('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});let hi=-1;for(let i=0;i<Math.min(rows.length,5);i++)if(rows[i].some(v=>String(v).includes('學號'))){hi=i;break}if(hi<0)throw new Error('找不到學號欄位');const h=rows[hi].map(v=>String(v).trim().toLowerCase()),ix={id:h.findIndex(v=>v.includes('學號')),cls:h.findIndex(v=>v.includes('班級')),no:h.findIndex(v=>v.includes('座號')),name:h.findIndex(v=>v.includes('姓名'))};if(Object.values(ix).some(v=>v<0))throw new Error('缺少必要欄位');students.length=0;let no=1;rows.slice(hi+1).forEach(row=>{const id=String(row[ix.id]||'').trim(),className=String(row[ix.cls]||'').trim(),number=String(row[ix.no]||'').trim(),name=String(row[ix.name]||'').trim();if(id&&name)students.push({no:no++,id,className,number,name})});cols=Number($('cols').value);autoFill();showStatus('✅ 已載入 '+students.length+' 位學生，並保留原始座號','success')}catch(err){showStatus('❌ 失敗：'+err.message,'error')}};r.readAsArrayBuffer(f)});
$('cols').addEventListener('change',function(){cols=Number(this.value);autoFill()});$('title').addEventListener('input',e=>$('frontTitle').textContent=e.target.value||'講台');
function saveLocal(){try{localStorage.setItem('seating-v1',JSON.stringify({students,order,cols,title:$('title').value}));showStatus('💾 已儲存到本機瀏覽器','success')}catch(e){showStatus('❌ 儲存失敗：'+e.message,'error')}}
function downloadExcel(){const d=order.map((no,i)=>{const s=no!==null?students.find(x=>x.no===no):null;return{'座位':i+1,'班級':s?s.className:'','座號':s?s.number:'','姓名':s?s.name:'','學號':s?s.id:''}}),ws=XLSX.utils.json_to_sheet(d),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'座位');XLSX.writeFile(wb,'seating.xlsx');showStatus('📊 Excel 已下載（保留原始座號）','success')}
function authHeaders(){const t=$('ghToken').value.trim();return t?{Authorization:'Bearer '+t}:{}}
function uploadToGithub(){const user=$('ghUser').value.trim(),repo=$('ghRepo').value.trim(),token=$('ghToken').value.trim(),branch=$('ghBranch').value.trim()||'main',title=$('title').value.trim()||'教室座位表',filename=title+'.json';if(!user||!repo||!token)return showStatus('❌ 請填寫 GitHub 使用者名稱、儲存庫和 Token','error');if(!students.length)return showStatus('❌ 無學生資料，請先上傳點名表','error');showStatus('☁️ 上傳中...','info');const api=`https://api.github.com/repos/${user}/${repo}/contents/${encodeURIComponent(filename)}`,content=btoa(unescape(encodeURIComponent(JSON.stringify({students,order,cols,title},null,2))));fetch(api+'?ref='+encodeURIComponent(branch),{headers:authHeaders()}).then(r=>r.ok?r.json().then(d=>d.sha):r.status===404?null:r.json().then(d=>Promise.reject(new Error(d.message||'HTTP '+r.status)))).then(sha=>fetch(api,{method:'PUT',headers:{...authHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:'Update seating chart: '+title,content,branch,...(sha?{sha}:{})})})).then(r=>r.ok?r.json():r.json().then(d=>Promise.reject(new Error(d.message||'HTTP '+r.status)))).then(()=>{showStatus('✅ 上傳成功！檔案：'+filename,'success');listGithubFiles()}).catch(e=>showStatus('❌ 上傳失敗：'+e.message,'error'))}
function listGithubFiles(){const user=$('ghUser').value.trim(),repo=$('ghRepo').value.trim(),branch=$('ghBranch').value.trim()||'main';if(!user||!repo)return showStatus('❌ 請填寫 GitHub 使用者名稱和儲存庫','error');showStatus('📋 列出檔案中...','info');fetch(`https://api.github.com/repos/${user}/${repo}/contents?ref=${encodeURIComponent(branch)}`,{headers:authHeaders()}).then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status))).then(files=>{const items=$('fileItems');items.innerHTML='';const json=files.filter(f=>f.name.endsWith('.json'));json.forEach(f=>{const el=document.createElement('div');el.className='file-item';el.textContent=f.name;el.onclick=()=>selectFile(f.name,el);items.appendChild(el)});$('fileCount').textContent=json.length;$('fileList').style.display=json.length?'block':'none';showStatus(json.length?'✅ 已找到 '+json.length+' 個 JSON 檔案':'⚠️ 未找到 JSON 檔案',json.length?'success':'info')}).catch(e=>showStatus('❌ 列出失敗：'+e.message,'error'))}
function selectFile(filename,el){selectedFilename=filename;$('selectedFileName').textContent=filename;$('selectedFile').style.display='block';document.querySelectorAll('.file-item').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');showStatus('✅ 已選擇：'+filename+'，請點選「📥 載入選擇的檔案」','success')}
function loadFromGithub(){if(!selectedFilename)return showStatus('❌ 請先選擇檔案','error');const user=$('ghUser').value.trim(),repo=$('ghRepo').value.trim(),branch=$('ghBranch').value.trim()||'main';showStatus('📥 載入中...','info');fetch(`https://raw.githubusercontent.com/${user}/${repo}/${encodeURIComponent(branch)}/${encodeURIComponent(selectedFilename)}`).then(r=>r.ok?r.json():Promise.reject(new Error(r.status===404?'找不到檔案：'+selectedFilename:'HTTP '+r.status))).then(data=>{students.length=0;(data.students||[]).forEach(s=>students.push(s));order=data.order||[];cols=data.cols||6;$('cols').value=cols;if(data.title){$('title').value=data.title;$('frontTitle').textContent=data.title}render();showStatus('✅ 已載入 '+students.length+' 人（'+selectedFilename+'）','success')}).catch(e=>showStatus('❌ 載入失敗：'+e.message,'error'))}
window.onload=()=>{try{const d=JSON.parse(localStorage.getItem('seating-v1'));if(d){students.length=0;(d.students||[]).forEach(s=>students.push(s));order=d.order||[];cols=d.cols||6;$('cols').value=cols;if(d.title){$('title').value=d.title;$('frontTitle').textContent=d.title}render();showStatus('✅ 從本機載入 '+students.length+' 人','success')}}catch(e){}}
</script>
</body>
</html>
